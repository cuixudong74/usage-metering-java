server.port=8080

# 聚合窗口大小（ISO-8601 时长），窗口按 epoch 对齐
metering.window-size=PT1H
# 窗口关闭后迟到事件策略：ACCEPT_AND_MARK（计入并标记）/ REJECT_AND_MARK（拒绝并留痕）
metering.late-policy=ACCEPT_AND_MARK
# 窗口宽限期：窗口结束后超过该时长即视为关闭
metering.grace-period=PT1H
# 快照目录与落盘间隔
metering.snapshot-dir=./data/snapshots
metering.snapshot-interval-ms=60000
# 窗口保留时长：超过该时长的窗口被关闭
metering.retention=PT24H
